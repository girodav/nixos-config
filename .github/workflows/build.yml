name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  toplevel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build --no-link .#nixosConfigurations.rivendell.config.system.build.toplevel
