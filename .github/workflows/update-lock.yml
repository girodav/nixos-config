name: update-flake-lock
on:
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC; opens or updates one PR, you merge it
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/update-flake-lock@main
        id: update
        with:
          pr-title: "flake.lock: daily update"
      # PRs opened with GITHUB_TOKEN don't trigger other workflows, so build here: a failed run means don't merge.
      - if: steps.update.outputs.pull-request-number != ''
        uses: actions/checkout@v4
        with:
          ref: update_flake_lock_action
      - if: steps.update.outputs.pull-request-number != ''
        run: nix build --no-link .#nixosConfigurations.rivendell.config.system.build.toplevel
