name: update-flake-lock
on:
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC; opens or updates one PR, you merge it
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # A personal token (not GITHUB_TOKEN) so the PR triggers build.yml like any other PR.
      - uses: DeterminateSystems/update-flake-lock@main
        with:
          token: ${{ secrets.UPDATE_LOCK_TOKEN }}
          pr-title: "flake.lock: daily update"
          pr-body: |
            Automated `flake.lock` update. The `build` check builds the system and comments the package-level diff; merge it yourself once that looks fine.

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```
